<rect x="318" y="130" width="220" height="88" rx="12" fill="#122735" stroke="#416679"/><text x="428" y="164">CV DETECTOR</text><text x="428" y="191" font-size="13" fill="#a5bdc7">threshold · top-hat · flow</text>
