<text x="40" y="551" font-family="Arial" font-size="13" fill="#8da7b5">Ground truth is excluded from detection and control; it is used for evaluation and selected-ID audit only.</text>
<text x="40" y="576" font-family="Arial" font-size="13" fill="#8da7b5">Reports: CSV, indexed SQLite, JSON, charts and software evidence PDF.</text>
